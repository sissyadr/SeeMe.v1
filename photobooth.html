<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeeMe! Studio</title>
    <link rel="stylesheet" href="photobooth_fixed.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="studio">

        <!-- ================= HEADER ================= -->
        <header class="studio-header">
            <a href="index.html" class="back-btn">← Back</a>
            <div>
                <h1>Studio</h1>
                <p>Here goes your digital mirror!</p>
            </div>
        </header>

        <!-- ================= MAIN ================= -->
        <main class="studio-content">

            <!-- =============== LEFT (SIDEBAR) =============== -->
            <aside class="sidebar">

                <!-- LAYOUT -->
                <section class="panel">
                    <h2>Layout</h2>
                    <div class="layout-grid">
                        <button class="layout-card active" data-layout="oval">
                            <span class="card-icon">⬭</span>
                            <span>Oval</span>
                        </button>
                        <button class="layout-card" data-layout="grid">
                            <span class="card-icon">▦</span>
                            <span>Grid</span>
                        </button>
                    </div>
                </section>

                <!-- FRAME -->
                <section class="panel panel-frame">
                    <div class="panel-title">
                        <h2>Frame</h2>
                        <small id="frameCount">0 Frames</small>
                    </div>
                    <p class="hint-text">
                        Pick and switch your favorite freely after your photos are captured.
                    </p>
                    <div id="frameList"><!-- Generated by JS --></div>
                </section>

                <!-- CUSTOMIZE -->
                <section class="panel">
                    <h2>Customize</h2>

                    <label class="toggle-row" for="timestampToggle">
                        <span>Add timestamp</span>
                        <span class="toggle-switch">
                            <input type="checkbox" id="timestampToggle">
                            <span class="toggle-track"><span class="toggle-thumb"></span></span>
                        </span>
                    </label>

                    <div class="field-group">
                        <label for="captionInput">Caption / words</label>
                        <input
                            type="text"
                            id="captionInput"
                            maxlength="40"
                            placeholder="e.g. Besties Forever ✧">
                    </div>
                </section>

            </aside>

            <!-- =============== RIGHT (WORKSPACE) =============== -->
            <section class="workspace">

                <!-- LIVE FILTER (compact strip, sits above the camera) -->
                <div class="filter-bar">
                    <div class="filter-bar-header">
                        <span>Filter</span>
                        <small id="filterHint">Original · live</small>
                    </div>
                    <div class="filter-strip" id="filterList">
                        <button class="filter-chip active" data-filter="none">
                            <span class="chip-dot"></span><span>Original</span>
                        </button>
                        <button class="filter-chip" data-filter="warm">
                            <span class="chip-dot"></span><span>Warm</span>
                        </button>
                        <button class="filter-chip" data-filter="vintage">
                            <span class="chip-dot"></span><span>Vintage</span>
                        </button>
                        <button class="filter-chip" data-filter="bw">
                            <span class="chip-dot"></span><span>B&amp;W</span>
                        </button>
                        <button class="filter-chip" data-filter="oldmovie">
                            <span class="chip-dot"></span><span>Old Movie</span>
                        </button>
                        <button class="filter-chip" data-filter="cocktail">
                            <span class="chip-dot"></span><span>Cocktail</span>
                        </button>
                        <button class="filter-chip" data-filter="spycam">
                            <span class="chip-dot"></span><span>Spy Cam</span>
                        </button>
                        <button class="filter-chip" data-filter="comicbook">
                            <span class="chip-dot"></span><span>Comic Book</span>
                        </button>
                        <button class="filter-chip" data-filter="thermal">
                            <span class="chip-dot"></span><span>Thermal</span>
                        </button>
                        <button class="filter-chip" data-filter="traditional">
                            <span class="chip-dot"></span><span>Traditional</span>
                        </button>
                    </div>
                </div>

                <!-- CAMERA -->
                <div class="camera-card">
                    <canvas id="livePreview"></canvas>
                    <video id="video" autoplay playsinline muted class="sr-only-video"></video>
                    <div id="flash" class="camera-flash"></div>
                    <div id="countdown">3</div>
                </div>

                <!-- ACTION -->
                <div class="camera-action">
                    <div class="shot-counter">
                        Captured
                        <strong id="shotsCounter">0 / 0</strong>
                    </div>
                    <button id="startBtn" disabled>Start Capturing</button>
                </div>

                <!-- RESULT (hidden until a photo exists) -->
                <div class="result-card" id="resultCard" style="display:none;">
                    <div class="preview-header">
                        <h2>Result</h2>
                    </div>
                    <canvas id="photostrip"></canvas>
                    <button id="downloadBtn">Download Photo</button>
                </div>

            </section>

        </main>
    </div>

    <script src="photobooth.js"></script>
</body>
</html>

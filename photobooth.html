<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeeMe! Studio</title>
    <link rel="stylesheet" href="photobooth_fixed.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="studio">

        <!-- ================= HEADER ================= -->
        <header class="studio-header">
            <a href="index.html" class="back-btn">← Back</a>
            <div>
                <h1>Studio</h1>
                <p>Here goes your digital mirror!</p>
            </div>
        </header>

        <!-- ================= MAIN ================= -->
        <main class="studio-content">

            <!-- =============== LEFT (SIDEBAR) =============== -->
            <aside class="sidebar">

                <!-- COLLECTION -->
                <section class="panel">
                    <h2>Collection</h2>
                    <div class="collection-grid">
                        <button class="collection-card active" data-collection="y2k">
                            <span class="card-icon">✦</span>
                            <span>Y2K</span>
                        </button>
                        <button class="collection-card" data-collection="frutiger">
                            <span class="card-icon">☁</span>
                            <span>Frutiger Aero</span>
                        </button>
                        <button class="collection-card" data-collection="gothic">
                            <span class="card-icon">🕸</span>
                            <span>Gothic</span>
                        </button>
                    </div>
                </section>

                <!-- LAYOUT -->
                <section class="panel">
                    <h2>Layout</h2>
                    <div class="layout-grid">
                        <button class="layout-card active" data-layout="oval">
                            <span class="card-icon">⬭</span>
                            <span>Oval</span>
                        </button>
                        <button class="layout-card" data-layout="grid6">
                            <span class="card-icon">▦</span>
                            <span>Grid 6</span>
                        </button>
                    </div>
                </section>

                <!-- FRAME -->
                <section class="panel">
                    <div class="panel-title">
                        <h2>Frame</h2>
                        <small id="frameCount">0 Frames</small>
                    </div>
                    <div id="frameList"><!-- Generated by JS --></div>
                </section>

                <!-- CUSTOMIZE -->
                <section class="panel">
                    <h2>Customize</h2>

                    <label class="toggle-row" for="timestampToggle">
                        <span>Add timestamp</span>
                        <span class="toggle-switch">
                            <input type="checkbox" id="timestampToggle">
                            <span class="toggle-track"><span class="toggle-thumb"></span></span>
                        </span>
                    </label>

                    <div class="field-group">
                        <label for="captionInput">Caption / words</label>
                        <input
                            type="text"
                            id="captionInput"
                            maxlength="40"
                            placeholder="e.g. Besties Forever ✧">
                    </div>
                </section>

                <!-- FILTER -->
                <section class="panel">
                    <div class="panel-title">
                        <h2>Filter</h2>
                        <small id="filterHint">Unlocks after capture</small>
                    </div>
                    <div class="filter-grid">
                        <button class="filter-btn active" data-filter="none">Original</button>
                        <button class="filter-btn" data-filter="warm">Warm</button>
                        <button class="filter-btn" data-filter="bw">B&amp;W</button>
                        <button class="filter-btn" data-filter="vintage">Vintage</button>
                    </div>
                </section>

            </aside>

            <!-- =============== RIGHT (WORKSPACE) =============== -->
            <section class="workspace">

                <!-- CAMERA -->
                <div class="camera-card">
                    <video id="video" autoplay playsinline muted></video>
                    <div id="flash" class="camera-flash"></div>
                    <div id="countdown">3</div>
                </div>

                <!-- ACTION -->
                <div class="camera-action">
                    <div class="shot-counter">
                        Captured
                        <strong id="shotsCounter">0 / 0</strong>
                    </div>
                    <button id="startBtn" disabled>Start Capturing</button>
                </div>

                <!-- RESULT (hidden until a photo exists) -->
                <div class="result-card" id="resultCard" style="display:none;">
                    <div class="preview-header">
                        <h2>Result</h2>
                    </div>
                    <canvas id="photostrip"></canvas>
                    <button id="downloadBtn">Download Photo</button>
                </div>

            </section>

        </main>
    </div>

    <script src="photobooth.js"></script>
</body>
</html>
